name: Discord Notifications

# 🔹 trigger on master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [published]
  issues:
    types: [opened, closed, edited]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed
        uses: actions/github-script@v6
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;

            // Standard Embed Template
            const embed = {
              embeds: [{
                title: "",
                description: "",
                color: 0x00ff00,
                timestamp: new Date().toISOString(),
                footer: {
                  text: `${github.repository}`
                }
              }]
            };

            // 🔹 Push Event
            if (github.event_name === "push") {
              embed.embeds[0].title = `🚀 Push by ${github.actor}`;
              embed.embeds[0].description = github.event.commits.map(c => `• [${c.id.slice(0,7)}](${c.url}) ${c.message}`).join("\n");
              embed.embeds[0].color = 0x1abc9c;
            }

            // 🔹 Pull Request Event
            if (github.event_name === "pull_request") {
              const pr = github.event.pull_request;
              embed.embeds[0].title = `📌 PR ${pr.action}: ${pr.title}`;
              embed.embeds[0].description = pr.body || "_No description_";
              embed.embeds[0].url = pr.html_url;
              embed.embeds[0].color = 0x3498db;
            }

            // 🔹 Release Event
            if (github.event_name === "release") {
              const rel = github.event.release;
              embed.embeds[0].title = `🏷️ Release: ${rel.name || rel.tag_name}`;
              embed.embeds[0].description = rel.body || "_No description_";
              embed.embeds[0].url = rel.html_url;
              embed.embeds[0].color = 0xe67e22;
            }

            // 🔹 Issues Event
            if (github.event_name === "issues") {
              const issue = github.event.issue;
              embed.embeds[0].title = `❗ Issue ${github.event.action}: ${issue.title}`;
              embed.embeds[0].description = issue.body || "_No description_";
              embed.embeds[0].url = issue.html_url;
              embed.embeds[0].color = 0xe74c3c;
            }

            await require('axios').post(webhook, embed);
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}